[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "test-suite-synthesizer"
version = "0.1.0"
description = "Static type and docstring introspector generating edge-case unit test skeletons for AI-authored modules"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
test-suite-synthesizer = "test_suite_synthesizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["test_suite_synthesizer*"]
